name: Aviso por Telegram

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Mandar el mensaje a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENTO: ${{ github.event_name }}
          TITULO: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Prueba manual' }}
          AUTOR: ${{ github.event.pull_request.user.login || github.actor }}
          LINK: ${{ github.event.pull_request.html_url || github.event.head_commit.url || format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          TITULO="${TITULO%%$'\n'*}"
          if [ "${EVENTO}" = "push" ]; then
            ENCABEZADO="Nuevo commit en main de ${AUTOR}"
          else
            ENCABEZADO="Nuevo Pull Request de ${AUTOR}"
          fi
          curl --fail --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${ENCABEZADO}: ${TITULO}
          ${LINK}"
