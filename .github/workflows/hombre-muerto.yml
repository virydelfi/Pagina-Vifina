name: Hombre muerto

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a healthchecks.io que seguimos vivos
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl --fail --silent --show-error --max-time 10 --retry 3 "${HEALTHCHECK_URL}"
